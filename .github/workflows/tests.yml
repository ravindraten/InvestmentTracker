name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Create venv and install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install pytest

      - name: Run tests
        run: .venv/bin/pytest